name: Legacy KM shell validation (not Agent release)

on:
  workflow_dispatch:
  schedule:
    - cron: "17 2 * * *"

concurrency:
  group: km-legacy-shell-validation
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Initialize pinned upstream source and public terminal dependency
        run: |
          git submodule update --init vendor/operit
          git -C vendor/operit submodule update --init --recursive terminal

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Restore stable KM signing identity
        uses: actions/cache@v4
        with:
          path: .km-signing/km-release.jks
          key: km-signing-identity-v1

      - name: Create signing identity on first build only
        shell: bash
        run: |
          if [ ! -f .km-signing/km-release.jks ]; then
            if [ ! -f .github/KM_SIGNING_BOOTSTRAP ]; then
              echo "Signing identity cache is missing; refusing to generate a replacement."
              exit 1
            fi
            mkdir -p .km-signing
            keytool -genkeypair -v -keystore .km-signing/km-release.jks \
              -storepass android -keypass android -alias km-release \
              -keyalg RSA -keysize 3072 -validity 10000 \
              -dname "CN=KM Personal Agent, OU=Mobile, O=KM, L=Personal, S=Personal, C=CN"
          fi

      - name: Scheduled cache check
        if: github.event_name == 'schedule'
        run: test -s .km-signing/km-release.jks

      - name: Locate Android SDK manager
        if: github.event_name != 'schedule'
        shell: bash
        run: |
          SDK_ROOT="$(printenv ANDROID_HOME)"
          if [ -z "$SDK_ROOT" ]; then SDK_ROOT="/usr/local/lib/android/sdk"; fi
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager 2>/dev/null | sort -V | tail -n 1)"
          if [ -z "$SDKMANAGER" ]; then
            echo "sdkmanager was not found under $SDK_ROOT/cmdline-tools"
            exit 1
          fi
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"

      - name: Accept Android SDK licenses
        if: github.event_name != 'schedule'
        shell: bash
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager --licenses

      - name: Install Android SDK packages
        if: github.event_name != 'schedule'
        run: sdkmanager --install "platforms;android-35" "build-tools;35.0.0"

      - name: Build KM APK with stable signing
        if: github.event_name != 'schedule'
        run: |
          gradle --no-daemon clean assembleDebug
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/km-legacy-shell-validation.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs dist/km-1.0.2.apk
          sha256sum dist/km-1.0.2.apk > dist/SHA256SUMS.txt

      - name: Upload signed APK
        if: github.event_name != 'schedule'
        uses: actions/upload-artifact@v4
        with:
          name: km-legacy-shell-validation
          path: dist/*
          if-no-files-found: error
          retention-days: 90
