plugins {
    id 'com.android.application'
}

android {
    namespace 'com.km.agent'
    compileSdk 35

    defaultConfig {
        // One-time package transition keeps the previously installed 0.2.0 app intact.
        // Future 0.3+ updates use this id and the cached stable signing identity.
        applicationId 'com.km.agent.mobile'
        minSdk 26
        targetSdk 35
        versionCode 6
        versionName '1.0.2'
    }

    signingConfigs {
        stable {
            storeFile rootProject.file(".km-signing/km-release.jks")
            storePassword "android"
            keyAlias "km-release"
            keyPassword "android"
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.stable
        }
        release {
            signingConfig signingConfigs.stable
            minifyEnabled false
        }
    }
}
